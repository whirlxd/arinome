name: Android build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use portable Gradle distribution
        run: sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: arinome-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Use portable Gradle distribution
        run: sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Validate signing secrets
        env:
          KEYSTORE: ${{ secrets.ARINOME_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ARINOME_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARINOME_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARINOME_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Build signed release APK
        env:
          ARINOME_KEYSTORE_BASE64: ${{ secrets.ARINOME_KEYSTORE_BASE64 }}
          ARINOME_KEYSTORE_FILE: ${{ runner.temp }}/arinome-release.jks
          ARINOME_KEYSTORE_PASSWORD: ${{ secrets.ARINOME_KEYSTORE_PASSWORD }}
          ARINOME_KEY_ALIAS: ${{ secrets.ARINOME_KEY_ALIAS }}
          ARINOME_KEY_PASSWORD: ${{ secrets.ARINOME_KEY_PASSWORD }}
        run: |
          printf '%s' "$ARINOME_KEYSTORE_BASE64" | base64 --decode > "$ARINOME_KEYSTORE_FILE"
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease --console=plain \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "arinome-${GITHUB_REF_NAME}.apk"
          sha256sum "arinome-${GITHUB_REF_NAME}.apk" > "arinome-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "arinome-${GITHUB_REF_NAME}.apk" \
            "arinome-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "arinome ${GITHUB_REF_NAME}"
