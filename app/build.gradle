apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: "androidx.navigation.safeargs"

def releaseSigningEnabled =
        System.getenv('ARINOME_KEYSTORE_FILE') &&
        System.getenv('ARINOME_KEYSTORE_PASSWORD') &&
        System.getenv('ARINOME_KEY_ALIAS') &&
        System.getenv('ARINOME_KEY_PASSWORD')

android {
    namespace = "com.whirlxd.arinome"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.whirlxd.arinome"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode = (project.findProperty('versionCode') ?: '1').toInteger()
        versionName = (project.findProperty('versionName') ?: '1.0.0').toString()
    }

    compileOptions {
        sourceCompatibility rootProject.ext.java_version
        targetCompatibility rootProject.ext.java_version
    }

    kotlinOptions {
        jvmTarget = "$rootProject.ext.java_version"
    }

    signingConfigs {
        if (releaseSigningEnabled) {
            release {
                storeFile file(System.getenv('ARINOME_KEYSTORE_FILE'))
                storePassword System.getenv('ARINOME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ARINOME_KEY_ALIAS')
                keyPassword System.getenv('ARINOME_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningEnabled) signingConfig signingConfigs.release
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {
    implementation project(':utils')

    // Kotlin lang
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // App compat and UI things
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Navigation library
    def nav_version = '2.7.6'
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // EXIF Interface
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
